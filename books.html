<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tất cả sách – Mầm Chữ</title>
  <meta name="description" content="Chọn sách theo thể loại hoặc tìm theo tên sách, tác giả tại Mầm Chữ.">
  <meta name="theme-color" content="#0F766E">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: "#0F766E", dark: "#115E59", light: "#CCEBE6" },
            sun: { DEFAULT: "#F5B82E", dark: "#D99A0B", light: "#FFF1CC" },
            cream: "#FFFBF2", paper: "#F6F1E4", line: "#E8E1D0",
            ink: "#1F2937", muted: "#5B6472", faint: "#8A93A0", sale: "#C2410C",
          },
          fontFamily: {
            heading: ['"Baloo 2"', "Nunito", "system-ui", "sans-serif"],
            body: ["Nunito", "system-ui", "-apple-system", '"Segoe UI"', "sans-serif"],
          },
          boxShadow: { card: "0 2px 8px rgba(31,41,55,0.07)", hover: "0 10px 28px rgba(31,41,55,0.14)" },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="mc-body">
  <a class="skip-link" href="#main">Bỏ qua, tới nội dung chính</a>
  <header id="site-header"></header>

  <main id="main" class="mx-auto max-w-[1200px] px-4 pb-16 pt-8 sm:px-6 md:pt-12">
    <!-- 1. Tiêu đề trang + số kết quả -->
    <div class="flex flex-wrap items-end justify-between gap-2">
      <h1>Tất cả sách</h1>
      <p id="result-count" class="text-muted" aria-live="polite"></p>
    </div>

    <!-- 2. Thanh công cụ: tìm kiếm + chip thể loại (dính phía trên khi cuộn trên desktop) -->
    <div class="toolbar z-30 -mx-4 mt-6 border-b border-line px-4 py-3 sm:-mx-6 sm:px-6 lg:sticky lg:top-[72px]">
      <form id="search-form" class="search-box max-w-xl" role="search" novalidate>
        <label for="search-input" class="sr-only">Tìm sách theo tên hoặc tác giả</label>
        <span data-icon="search" data-icon-size="20"></span>
        <input id="search-input" class="input" type="search" name="q" maxlength="60" autocomplete="off"
               placeholder="Tìm tên sách, tác giả...">
      </form>
      <div class="mt-3 flex flex-wrap items-center gap-2">
        <div id="chip-row" class="chip-row min-w-0 flex-1" role="group" aria-label="Lọc theo thể loại"></div>
        <button id="clear-filter" type="button" class="btn btn-ghost" hidden>Xóa lọc</button>
      </div>
    </div>

    <!-- 3. Lưới sách (F03: lọc + tìm; F17: giá gốc + badge giảm giá; F07: thêm vào giỏ) -->
    <div id="books-grid" class="mt-6 grid grid-cols-2 gap-3 sm:gap-4 md:grid-cols-3 lg:grid-cols-4" aria-live="polite" aria-busy="true"></div>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="assets/js/pages/books.js"></script>
</body>
</html>
